<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dockling</title>
<!-- Safari's tab icon specifically checks for a root-level favicon.ico
     independent of the PNG link below, even though it does support PNG
     favicons in general — confirmed by it showing correctly in Chrome but
     not Safari with only the PNG link present. -->
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/yellow-idle-hires.png">
<link rel="preload" as="image" href="assets/yellow-angry-hires.png">
<link rel="preload" as="audio" href="assets/quack.mp3">
<style>
  :root {
    color-scheme: light;
    /* Shared by .duck and .reveal below, so the hidden text's position and
       size scale together with however big the duck actually renders. */
    --duck-size: min(620px, 92vw);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #ffffff;
    color: #1a1a1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  /* Everything stays hidden until the duck art has actually finished
     loading (see the script's "ready" handling) — the <img> box reserves
     its space via CSS the instant the page parses, well before its pixels
     have necessarily arrived, so being later in the DOM only guarantees
     she's on top once she's actually rendered. On a slow connection,
     without this, there'd be a real window where the reveal text is laid
     out and paintable but nothing opaque sits over it yet. A plain white
     screen for that moment is indistinguishable from a normal page load. */
  body.loading .reveal,
  body.loading .duck {
    visibility: hidden;
  }

  /* The duck art keeps its real transparency (no backing shape) — instead,
     .reveal is placed inside the one region of the artwork that's reliably
     solid at rest (the belly, well clear of the wing's transparent gaps),
     found by scanning the PNG's actual alpha channel rather than guessing.
     Everything here scales off --duck-size, so it stays inside that region
     whether the duck renders at its 620px cap or shrunk down on a phone. */
  .reveal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% + var(--duck-size) * 0.182));
    text-align: center;
  }
  .reveal p {
    margin: 0 0 calc(var(--duck-size) * 0.012);
    font-size: calc(var(--duck-size) * 0.034);
    line-height: 1.15;
  }
  .reveal a {
    display: inline-block;
    font-size: calc(var(--duck-size) * 0.025);
    padding: calc(var(--duck-size) * 0.013) calc(var(--duck-size) * 0.028);
    border: 2px solid #1a1a1a;
    border-radius: 999px;
    text-decoration: none;
    color: #1a1a1a;
    transition: background .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .reveal a:hover { background: #1a1a1a; color: #fff; }

  .duck {
    /* Positioned via plain left/top, set once by the script on load, and
       kept that way for its whole life — no translate(-50%,-50%) centering
       trick. Mixing that trick with `scale` threw off which point it grew
       from (it visibly crept up-left on hover instead of growing evenly),
       since the two would compose around different origins depending on
       whether .duck had been dragged yet. One positioning scheme the whole
       time keeps `scale`'s default center-of-the-box origin doing exactly
       that: growing evenly outward in every direction. */
    position: fixed;
    width: var(--duck-size);
    aspect-ratio: 1 / 1;
    cursor: default; /* JS owns the real cursor once alpha hit-testing is ready */
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.14));
    scale: 1;
    transition: scale .15s ease;
  }
  /* Driven by JS (alpha hit-testing below), not :hover/:active — those are
     bounding-box only, and the box around this art is a lot bigger than
     the duck actually drawn inside it. */
  .duck.hovering { scale: 1.06; }

  /* "dockling!" in crayon, one letter per duck color, sitting in the
     page's static layout above wherever the duck happens to be — not
     tracking her position, the way a site title wouldn't. Static per-letter
     rotation/offset (hand-picked, not randomized or animated) is what
     sells "written by a kid," same spirit as the wobbly bezel elsewhere in
     this project; the letters themselves never move once laid out. The
     dark stroke keeps the paler colors (baby blue, lavender, tan...)
     legible against the white page, and doubles as the same bold-outline
     look the duck art itself uses. */
  .title {
    position: fixed;
    top: max(20px, 4vh);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    -webkit-user-select: none;
    user-select: none;
  }
  .title span {
    font-family: 'Schoolbell', cursive;
    font-size: clamp(40px, 8vw, 72px);
    -webkit-text-stroke: 2px #1a1a1a;
    text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.1);
    cursor: pointer;
    /* Separate property from the per-letter transform below (rotation and
       baseline offset), same reasoning as the duck's own hover-grow — they
       compose independently instead of one clobbering the other. */
    scale: 1;
    transition: scale .15s ease;
  }
  .title span:hover { scale: 1.2; }
  .title span:nth-child(1) { transform: rotate(-8deg) translateY(2px); }
  .title span:nth-child(2) { transform: rotate(5deg) translateY(-4px); }
  .title span:nth-child(3) { transform: rotate(-3deg) translateY(5px); }
  .title span:nth-child(4) { transform: rotate(7deg) translateY(-3px); }
  .title span:nth-child(5) { transform: rotate(-5deg) translateY(4px); }
  .title span:nth-child(6) { transform: rotate(4deg) translateY(-5px); }
  .title span:nth-child(7) { transform: rotate(-6deg) translateY(2px); }
  .title span:nth-child(8) { transform: rotate(6deg) translateY(-3px); }
  .title span:nth-child(9) { transform: rotate(-4deg) translateY(3px); }
</style>
</head>
<body class="loading">

<div class="title" aria-label="dockling!" id="title">
  <span style="color:#FBDA2E" data-color="yellow">d</span>
  <span style="color:#FF62B0" data-color="pink">o</span>
  <span style="color:#AFE4FF" data-color="babyblue">c</span>
  <span style="color:#F6982D" data-color="orange">k</span>
  <span style="color:#CAA7FF" data-color="lavender">l</span>
  <span style="color:#A5F6AB" data-color="green">i</span>
  <span style="color:#2E8DFB" data-color="blue">n</span>
  <span style="color:#E2CAA2" data-color="tan">g</span>
  <span style="color:#C6BFBF" data-color="gray">!</span>
</div>

<div class="reveal" id="reveal">
  <p>Curious?</p>
  <a id="download-link" href="https://github.com/abbykatz23/dockling/releases/latest/download/Dockling.dmg">Download Dockling for Mac</a>
</div>

<img class="duck" id="duck" src="assets/yellow-idle-hires.png" alt="A duck. Try dragging her.">

<script>
(function () {
  var duck = document.getElementById("duck");
  var dragging = false;
  var offsetX = 0, offsetY = 0;

  // Yellow's images are the full-resolution originals (always loaded, so
  // worth the extra quality); the other 8 colors are a smaller size,
  // fetched lazily — see DUCK_IMAGES — only when a letter of "dockling!"
  // actually gets hovered, so a visitor who never hovers the title never
  // pays for them.
  var DUCK_IMAGES = {
    yellow:   { idle: "assets/yellow-idle-hires.png", angry: "assets/yellow-angry-hires.png", sleepy: "assets/yellow-sleepy-hires.png" },
    pink:     { idle: "assets/pink-idle.png", angry: "assets/pink-angry.png", sleepy: "assets/pink-sleepy.png" },
    babyblue: { idle: "assets/babyblue-idle.png", angry: "assets/babyblue-angry.png", sleepy: "assets/babyblue-sleepy.png" },
    orange:   { idle: "assets/orange-idle.png", angry: "assets/orange-angry.png", sleepy: "assets/orange-sleepy.png" },
    lavender: { idle: "assets/lavender-idle.png", angry: "assets/lavender-angry.png", sleepy: "assets/lavender-sleepy.png" },
    green:    { idle: "assets/green-idle.png", angry: "assets/green-angry.png", sleepy: "assets/green-sleepy.png" },
    blue:     { idle: "assets/blue-idle.png", angry: "assets/blue-angry.png", sleepy: "assets/blue-sleepy.png" },
    tan:      { idle: "assets/tan-idle.png", angry: "assets/tan-angry.png", sleepy: "assets/tan-sleepy.png" },
    gray:     { idle: "assets/gray-idle.png", angry: "assets/gray-angry.png", sleepy: "assets/gray-sleepy.png" }
  };
  var DEFAULT_COLOR = "yellow";
  // What she settles back to once the mouse leaves a letter — starts as
  // the default, but clicking a letter "locks in" that color as the new
  // one to settle back to, until another letter gets clicked.
  var stickyColor = DEFAULT_COLOR;
  var currentColor = DEFAULT_COLOR;
  var currentPose = "idle"; // "idle" | "angry" | "sleepy" — her actual state, independent of color

  // The one place duck.src ever gets set — every pose change below just
  // updates currentPose and calls this, so hovering a letter (which only
  // ever touches currentColor) always shows that color in whatever pose
  // she's actually in, exactly as asked.
  function applyDuckImage() {
    duck.src = DUCK_IMAGES[currentColor][currentPose];
  }

  function prefetchPose(color, pose) {
    new Image().src = DUCK_IMAGES[color][pose];
  }

  // Prefetches angry+sleepy for a color at most once, no matter how many
  // times it gets hovered/clicked — without this, idly sweeping the mouse
  // back over letters already visited kept reissuing fetches for images
  // that were already cached (harmless, but pure waste).
  var prefetchedColors = {};
  function ensurePrefetched(color) {
    if (prefetchedColors[color]) return;
    prefetchedColors[color] = true;
    prefetchPose(color, "angry");
    prefetchPose(color, "sleepy");
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  // How much of the duck must stay on-screen — small enough that she can
  // be dragged mostly off any edge, large enough to still grab her back.
  var MIN_VISIBLE = 70;

  // Positioned via left/top from the very start (see the .duck CSS
  // comment) — this sets that starting position, and keeps it centered
  // across a resize for as long as she hasn't been dragged yet, which is
  // what the old CSS-transform centering trick did automatically.
  function centerDuck() {
    duck.style.left = (window.innerWidth / 2 - duck.offsetWidth / 2) + "px";
    duck.style.top = (window.innerHeight / 2 - duck.offsetHeight / 2) + "px";
  }
  centerDuck();
  window.addEventListener("resize", function () {
    if (!dragging) centerDuck();
  });

  // Keeps the whole page hidden (see body.loading in the CSS) until the
  // duck art has actually rendered, not just until her <img> box exists —
  // reveals on error too, rather than risking a page that stays blank
  // forever if the asset genuinely fails to load.
  function revealPage() {
    document.body.classList.remove("loading");
  }
  if (duck.complete) revealPage();
  else {
    duck.addEventListener("load", revealPage);
    duck.addEventListener("error", revealPage);
  }

  // Falls asleep after 60s with no activity anywhere on the page — not
  // just no interaction with her specifically. Any real drag already keeps
  // resetting this via pointermove, so she can never actually doze off
  // mid-drag; the `dragging` check below is just a defensive second layer
  // in case some browser ever fires these in a different order than
  // expected. Prefetched lazily (not <link rel=preload>, which would
  // compete for bandwidth with the art actually needed for first paint)
  // once the page is already up and idle-ish.
  var SLEEPY_TIMEOUT = 60 * 1000;
  var sleepyTimer = null;

  function prefetchSleepy() {
    prefetchPose(DEFAULT_COLOR, "sleepy");
  }
  if (duck.complete) prefetchSleepy();
  else duck.addEventListener("load", prefetchSleepy);

  function goSleepy() {
    if (dragging) return;
    currentPose = "sleepy";
    applyDuckImage();
  }

  function scheduleSleepy() {
    clearTimeout(sleepyTimer);
    sleepyTimer = setTimeout(goSleepy, SLEEPY_TIMEOUT);
  }

  function markActivity() {
    if (currentPose === "sleepy" && !dragging) {
      currentPose = "idle";
      applyDuckImage();
    }
    scheduleSleepy();
  }

  ["pointerdown", "pointermove", "keydown", "wheel"].forEach(function (type) {
    window.addEventListener(type, markActivity, { passive: true });
  });
  scheduleSleepy(); // the clock starts from page load, with zero activity yet

  // Alpha hit-testing: the <img> element's box is a big square, but the
  // duck drawn inside it is an irregular shape with real transparency
  // around it — without this, hovering (or grabbing) the empty corners of
  // that square would act like hovering/grabbing the duck herself. A
  // hidden canvas holds the same art at its natural resolution purely so
  // its pixels can be read back with getImageData.
  var hitCanvas = document.createElement("canvas");
  var hitCtx = hitCanvas.getContext("2d", { willReadFrequently: true });
  var hitReady = false;

  function prepareHitCanvas() {
    hitCanvas.width = duck.naturalWidth;
    hitCanvas.height = duck.naturalHeight;
    hitCtx.drawImage(duck, 0, 0);
    hitReady = true;
  }
  if (duck.complete) prepareHitCanvas();
  else duck.addEventListener("load", prepareHitCanvas);

  function alphaAt(clientX, clientY) {
    if (!hitReady) return 0; // fail closed — no false grabs before it's ready
    var rect = duck.getBoundingClientRect();
    var nx = (clientX - rect.left) / rect.width;
    var ny = (clientY - rect.top) / rect.height;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return 0;
    var px = Math.min(hitCanvas.width - 1, Math.floor(nx * hitCanvas.width));
    var py = Math.min(hitCanvas.height - 1, Math.floor(ny * hitCanvas.height));
    return hitCtx.getImageData(px, py, 1, 1).data[3];
  }
  var ALPHA_THRESHOLD = 40;

  function place(clientX, clientY) {
    var w = duck.offsetWidth, h = duck.offsetHeight;
    var x = clamp(clientX - offsetX, MIN_VISIBLE - w, window.innerWidth - MIN_VISIBLE);
    var y = clamp(clientY - offsetY, MIN_VISIBLE - h, window.innerHeight - MIN_VISIBLE);
    duck.style.left = x + "px";
    duck.style.top = y + "px";
  }

  duck.addEventListener("pointerdown", function (e) {
    if (alphaAt(e.clientX, e.clientY) <= ALPHA_THRESHOLD) return; // clicked a transparent corner

    var rect = duck.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    dragging = true;
    currentPose = "angry"; // she does not appreciate being picked up
    applyDuckImage();
    duck.classList.add("hovering");
    duck.style.cursor = "grabbing";
    duck.setPointerCapture(e.pointerId);
  });

  duck.addEventListener("pointermove", function (e) {
    if (dragging) {
      place(e.clientX, e.clientY);
      return;
    }
    var onDuck = alphaAt(e.clientX, e.clientY) > ALPHA_THRESHOLD;
    duck.classList.toggle("hovering", onDuck);
    duck.style.cursor = onDuck ? "grab" : "default";
  });

  duck.addEventListener("pointerleave", function () {
    if (dragging) return;
    duck.classList.remove("hovering");
    duck.style.cursor = "default";
  });

  function stop() {
    dragging = false;
    currentPose = "idle"; // back to her usual self once let go
    applyDuckImage();
    scheduleSleepy(); // letting go counts as activity too, even with no pointermove in between
  }
  duck.addEventListener("pointerup", stop);
  duck.addEventListener("pointercancel", stop);

  // This link points straight at the DMG asset (not the GitHub releases
  // page), so clicking it triggers a real file download rather than a page
  // navigation — the browser never leaves this page, so the quack always
  // gets to play out in full.
  var downloadLink = document.getElementById("download-link");
  downloadLink.addEventListener("click", function () {
    try {
      new Audio("assets/quack.mp3").play().catch(function () {});
    } catch (e) {}
  });

  // Hovering a letter of "dockling!" turns her that color — whatever pose
  // she's actually in (idle, angry mid-drag, or asleep) stays exactly as
  // it was, only the color changes. Reverts to stickyColor (not always
  // yellow — see its declaration) once the mouse leaves the letter.
  // Clicking a letter locks that color in as the new stickyColor, so it
  // stays even after the mouse moves away, until another letter is
  // clicked. Mouse-only on purpose (mouseenter/leave/click, not pointer
  // events) — touch has no real hover, so there's nothing meaningful to
  // wire up there.
  document.querySelectorAll("#title span").forEach(function (letter) {
    var color = letter.getAttribute("data-color");
    letter.addEventListener("mouseenter", function () {
      currentColor = color;
      applyDuckImage();
      // Idle is showing already (line above), but angry and sleepy for
      // this color are still completely unfetched at this point — without
      // this, dragging her (or just leaving her be for 60s) right after
      // hovering a new color meant a real, visible delay the first time
      // that pose was actually needed, waiting on a fetch that only just
      // started.
      ensurePrefetched(color);
    });
    letter.addEventListener("mouseleave", function () {
      currentColor = stickyColor;
      applyDuckImage();
    });
    letter.addEventListener("click", function () {
      stickyColor = color;
      currentColor = color;
      applyDuckImage();
      // Also called here, not just from mouseenter above: if the cursor is
      // already resting on a letter when the page loads (or the user
      // returns via back-navigation without moving the mouse first), click
      // can fire with no preceding mouseenter at all.
      ensurePrefetched(color);
    });
  });
})();
</script>
</body>
</html>
