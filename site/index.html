<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dockling</title>
<!-- Safari's tab icon specifically checks for a root-level favicon.ico
     independent of the PNG link below, even though it does support PNG
     favicons in general — confirmed by it showing correctly in Chrome but
     not Safari with only the PNG link present. -->
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/yellow-idle-hires.png">
<link rel="preload" as="image" href="assets/yellow-angry-hires.png">
<link rel="preload" as="audio" href="assets/quack.mp3">
<style>
  :root {
    color-scheme: light;
    /* Shared by .duck and .reveal below, so the hidden text's position and
       size scale together with however big the duck actually renders. */
    --duck-size: min(620px, 92vw);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #ffffff;
    color: #1a1a1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  /* Everything stays hidden until the duck art has actually finished
     loading (see the script's "ready" handling) — the <img> box reserves
     its space via CSS the instant the page parses, well before its pixels
     have necessarily arrived, so being later in the DOM only guarantees
     she's on top once she's actually rendered. On a slow connection,
     without this, there'd be a real window where the reveal text is laid
     out and paintable but nothing opaque sits over it yet. A plain white
     screen for that moment is indistinguishable from a normal page load. */
  body.loading .reveal,
  body.loading .duck {
    visibility: hidden;
  }

  /* The duck art keeps its real transparency (no backing shape) — instead,
     .reveal is placed inside the one region of the artwork that's reliably
     solid at rest (the belly, well clear of the wing's transparent gaps),
     found by scanning the PNG's actual alpha channel rather than guessing.
     Everything here scales off --duck-size, so it stays inside that region
     whether the duck renders at its 620px cap or shrunk down on a phone. */
  .reveal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% + var(--duck-size) * 0.182));
    text-align: center;
  }
  .reveal p {
    margin: 0 0 calc(var(--duck-size) * 0.012);
    font-size: calc(var(--duck-size) * 0.034);
    line-height: 1.15;
  }
  .reveal a {
    display: inline-block;
    font-size: calc(var(--duck-size) * 0.025);
    padding: calc(var(--duck-size) * 0.013) calc(var(--duck-size) * 0.028);
    border: 2px solid #1a1a1a;
    border-radius: 999px;
    text-decoration: none;
    color: #1a1a1a;
    transition: background .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .reveal a:hover { background: #1a1a1a; color: #fff; }

  /* "Curious?" itself is now the link to the README — an ordinary blue
     text link (not a second pill button, so it doesn't visually compete
     with the one real call-to-action, the download button right below
     it), using the same blue already in the "n" of the title above. */
  /* Explicitly resets every pill-button property the more general
     `.reveal a` rule above still applies otherwise (border, padding,
     border-radius, inline-block sizing) — color/text-decoration alone
     weren't enough to stop looking like a button, since those box
     properties aren't things this rule was touching at all, just
     inheriting from the higher-specificity-losing but still-applying
     general rule for whatever it doesn't override. */
  .reveal p a {
    display: inline;
    padding: 0;
    border: none;
    border-radius: 0;
    color: #2E8DFB;
    text-decoration: underline;
    white-space: normal;
  }
  .reveal p a:hover { color: #1a1a1a; background: none; }

  .duck {
    /* Positioned via plain left/top, set once by the script on load, and
       kept that way for its whole life — no translate(-50%,-50%) centering
       trick. Mixing that trick with `scale` threw off which point it grew
       from (it visibly crept up-left on hover instead of growing evenly),
       since the two would compose around different origins depending on
       whether .duck had been dragged yet. One positioning scheme the whole
       time keeps `scale`'s default center-of-the-box origin doing exactly
       that: growing evenly outward in every direction. */
    position: fixed;
    width: var(--duck-size);
    aspect-ratio: 1 / 1;
    cursor: default; /* JS owns the real cursor once alpha hit-testing is ready */
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.14));
    scale: 1;
    transition: scale .15s ease;
  }
  /* Driven by JS (alpha hit-testing below), not :hover/:active — those are
     bounding-box only, and the box around this art is a lot bigger than
     the duck actually drawn inside it. */
  .duck.hovering { scale: 1.06; }

  /* "dockling!" in crayon, one letter per duck color, sitting in the
     page's static layout above wherever the duck happens to be — not
     tracking her position, the way a site title wouldn't. Static per-letter
     rotation/offset (hand-picked, not randomized or animated) is what
     sells "written by a kid," same spirit as the wobbly bezel elsewhere in
     this project; the letters themselves never move once laid out. The
     dark stroke keeps the paler colors (baby blue, lavender, tan...)
     legible against the white page, and doubles as the same bold-outline
     look the duck art itself uses. */
  .title {
    position: fixed;
    top: max(20px, 4vh);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    -webkit-user-select: none;
    user-select: none;
  }
  .title span {
    font-family: 'Schoolbell', cursive;
    font-size: clamp(40px, 8vw, 72px);
    -webkit-text-stroke: 2px #1a1a1a;
    text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.1);
    cursor: pointer;
    /* Separate property from the per-letter transform below (rotation and
       baseline offset), same reasoning as the duck's own hover-grow — they
       compose independently instead of one clobbering the other. */
    scale: 1;
    transition: scale .15s ease;
  }
  .title span:hover { scale: 1.2; }
  .title span:nth-child(1) { transform: rotate(-8deg) translateY(2px); }
  .title span:nth-child(2) { transform: rotate(5deg) translateY(-4px); }
  .title span:nth-child(3) { transform: rotate(-3deg) translateY(5px); }
  .title span:nth-child(4) { transform: rotate(7deg) translateY(-3px); }
  .title span:nth-child(5) { transform: rotate(-5deg) translateY(4px); }
  .title span:nth-child(6) { transform: rotate(4deg) translateY(-5px); }
  .title span:nth-child(7) { transform: rotate(-6deg) translateY(2px); }
  .title span:nth-child(8) { transform: rotate(6deg) translateY(-3px); }
  .title span:nth-child(9) { transform: rotate(-4deg) translateY(3px); }

  /* A little "help" duck in the corner — thinking pose at rest, crossfades
     to the eureka pose on hover, and — once the big duck's actually been
     dragged — permanently on to the thumbs-up pose at rest (both via a
     `.solved` class JS adds on the first real drag movement, "even a
     little bit"; CSS alone can't track a one-way, page-lifetime event like
     that, only JS keeps state). Fixed in place, unlike the big duck: this
     one's a UI element, not a toy. */
  .help-duck {
    position: fixed;
    left: max(16px, 2vw);
    bottom: max(16px, 2vh);
    width: 56px;
    height: 56px;
    z-index: 10;
    -webkit-user-select: none;
    user-select: none;
  }
  .help-duck-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.14));
    transition: opacity .2s ease, transform .2s ease;
  }
  /* Priority (highest wins): hovering/focused > sleepy > solved > default —
     each just toggles which single image is opacity:1, so exactly one is
     ever visible regardless of which combination of .sleepy/.solved/:hover
     is currently true. */
  .help-duck-eureka,
  .help-duck-thumbsup,
  .help-duck-sleepy { opacity: 0; }
  .help-duck.solved .help-duck-thinking { opacity: 0; }
  .help-duck.solved .help-duck-thumbsup { opacity: 1; }
  .help-duck.sleepy .help-duck-thinking,
  .help-duck.sleepy .help-duck-thumbsup { opacity: 0; }
  .help-duck.sleepy .help-duck-sleepy { opacity: 1; }
  /* .hovering, not :hover/:focus directly — a plain :focus sticks around
     after a click even once the mouse has moved away (confirmed happening:
     clicking her then moving away left the eureka image showing via :focus
     while the bubble *text*, driven separately by JS mouseleave, had
     already reverted to "Need help?" — the two fell out of sync). Routing
     both the image and the text through the exact same JS-toggled class
     (see setHovering() below) is what keeps them permanently in lockstep,
     regardless of mouse vs. keyboard, or a click's lingering focus. */
  .help-duck.hovering .help-duck-img { opacity: 0; transform: scale(1.08); }
  .help-duck.hovering .help-duck-eureka { opacity: 1; }
  .help-duck:focus { outline: none; }

  /* A hand-drawn-style speech bubble, same 2px-outline-plus-offset-shadow
     language as .reveal a and .help-bubble's own tail below — always
     visible now (its *text* is what changes, driven by JS: "Need help?"
     at rest, "I think the duck is hiding something" on hover, "Genius!"
     at rest once solved), not hidden until hover the way it started out. */
  .help-bubble {
    position: absolute;
    left: 0;
    bottom: calc(100% + 14px);
    /* Hugs whatever text is actually showing ("Need help?", "Genius!", the
       longer hover hint) instead of one fixed width sized for the longest
       of them — max-width is what still wraps that longer one instead of
       overflowing, rather than growing the box arbitrarily wide. */
    width: max-content;
    max-width: 200px;
    background: #fff;
    border: 2px solid #1a1a1a;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.35;
    box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.1);
    pointer-events: none;
    transition: transform .15s ease;
  }
  .help-duck.hovering .help-bubble {
    transform: translateY(-3px);
  }
  /* Two stacked triangles (outline color, then a slightly smaller white
     one on top) is the standard way to give a CSS speech-bubble tail the
     same 2px-border look as the bubble body itself, since a single
     border-only triangle can't have its own inner fill/outer stroke. */
  .help-bubble::after,
  .help-bubble::before {
    content: "";
    position: absolute;
    border: 7px solid transparent;
  }
  .help-bubble::after {
    left: 18px;
    top: 100%;
    border-top-color: #1a1a1a;
  }
  .help-bubble::before {
    left: 20px;
    top: calc(100% - 2px);
    border-width: 5px;
    border-top-color: #fff;
  }
</style>
</head>
<body class="loading">

<div class="title" aria-label="dockling!" id="title">
  <span style="color:#FBDA2E" data-color="yellow">d</span>
  <span style="color:#FF62B0" data-color="pink">o</span>
  <span style="color:#AFE4FF" data-color="babyblue">c</span>
  <span style="color:#F6982D" data-color="orange">k</span>
  <span style="color:#CAA7FF" data-color="lavender">l</span>
  <span style="color:#A5F6AB" data-color="green">i</span>
  <span style="color:#2E8DFB" data-color="blue">n</span>
  <span style="color:#E2CAA2" data-color="tan">g</span>
  <span style="color:#C6BFBF" data-color="gray">!</span>
</div>

<div class="reveal" id="reveal">
  <p><a href="https://github.com/abbykatz23/dockling/blob/main/README.md" target="_blank" rel="noopener">Curious?</a></p>
  <a id="download-link" href="https://github.com/abbykatz23/dockling/releases/latest/download/Dockling.dmg">Download dockling for Mac</a>
</div>

<img class="duck" id="duck" src="assets/yellow-idle-hires.png" alt="A duck. Try dragging her.">

<div class="help-duck" id="helpDuck" tabindex="0" aria-label="Need help?">
  <div class="help-bubble" id="helpBubble">Need help?</div>
  <img class="help-duck-img help-duck-thinking" src="assets/help-yellow-thinking.png" alt="">
  <img class="help-duck-img help-duck-eureka" src="assets/help-yellow-eureka.png" alt="">
  <img class="help-duck-img help-duck-thumbsup" src="assets/help-yellow-thumbsup.png" alt="">
  <img class="help-duck-img help-duck-sleepy" src="assets/help-yellow-sleepy.png" alt="">
</div>

<script>
(function () {
  var duck = document.getElementById("duck");
  var dragging = false;
  var offsetX = 0, offsetY = 0;

  var DEFAULT_COLOR = "yellow";
  var COLORS = ["yellow", "pink", "babyblue", "orange", "lavender", "green", "blue", "tan", "gray"];

  // Yellow's images are the full-resolution originals (always loaded, so
  // worth the extra quality); the other 8 colors are a smaller size,
  // fetched lazily — see ensurePrefetched — only when a letter of
  // "dockling!" actually gets hovered, so a visitor who never hovers the
  // title never pays for them.
  var DUCK_IMAGES = {};
  COLORS.forEach(function (color) {
    var suffix = color === DEFAULT_COLOR ? "-hires" : "";
    DUCK_IMAGES[color] = {
      idle: "assets/" + color + "-idle" + suffix + ".png",
      angry: "assets/" + color + "-angry" + suffix + ".png",
      sleepy: "assets/" + color + "-sleepy" + suffix + ".png"
    };
  });
  // What she settles back to once the mouse leaves a letter — starts as
  // the default, but clicking a letter "locks in" that color as the new
  // one to settle back to, until another letter gets clicked.
  var stickyColor = DEFAULT_COLOR;
  var currentColor = DEFAULT_COLOR;
  var currentPose = "idle"; // "idle" | "angry" | "sleepy" — her actual state, independent of color

  // The one place duck.src ever gets set — every pose change below just
  // updates currentPose and calls this, so hovering a letter (which only
  // ever touches currentColor) always shows that color in whatever pose
  // she's actually in, exactly as asked.
  function applyDuckImage() {
    duck.src = DUCK_IMAGES[currentColor][currentPose];
  }

  function prefetchPose(color, pose) {
    new Image().src = DUCK_IMAGES[color][pose];
  }

  // Prefetches angry+sleepy for a color at most once, no matter how many
  // times it gets hovered/clicked — without this, idly sweeping the mouse
  // back over letters already visited kept reissuing fetches for images
  // that were already cached (harmless, but pure waste).
  var prefetchedColors = {};
  function ensurePrefetched(color) {
    if (prefetchedColors[color]) return;
    prefetchedColors[color] = true;
    prefetchPose(color, "angry");
    prefetchPose(color, "sleepy");
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  // How much of the duck must stay on-screen — small enough that she can
  // be dragged mostly off any edge, large enough to still grab her back.
  var MIN_VISIBLE = 70;

  // Positioned via left/top from the very start (see the .duck CSS
  // comment) — this sets that starting position, and keeps it centered
  // across a resize for as long as she hasn't been dragged yet, which is
  // what the old CSS-transform centering trick did automatically.
  function centerDuck() {
    duck.style.left = (window.innerWidth / 2 - duck.offsetWidth / 2) + "px";
    duck.style.top = (window.innerHeight / 2 - duck.offsetHeight / 2) + "px";
  }
  centerDuck();
  window.addEventListener("resize", function () {
    if (!dragging) centerDuck();
  });

  // Keeps the whole page hidden (see body.loading in the CSS) until the
  // duck art has actually rendered, not just until her <img> box exists —
  // reveals on error too, rather than risking a page that stays blank
  // forever if the asset genuinely fails to load.
  function revealPage() {
    document.body.classList.remove("loading");
  }
  if (duck.complete) revealPage();
  else {
    duck.addEventListener("load", revealPage);
    duck.addEventListener("error", revealPage);
  }

  // Falls asleep after 45s with no activity anywhere on the page — not
  // just no interaction with her specifically. Any real drag already keeps
  // resetting this via pointermove, so she can never actually doze off
  // mid-drag; the `dragging` check below is just a defensive second layer
  // in case some browser ever fires these in a different order than
  // expected. Prefetched lazily (not <link rel=preload>, which would
  // compete for bandwidth with the art actually needed for first paint)
  // once the page is already up and idle-ish. The corner help duck shares
  // this exact same timer/trigger (see setHelpDuckSleepy below) rather than
  // running a second one of her own — one page-wide notion of "idle,"
  // not two independently-drifting clocks.
  var SLEEPY_TIMEOUT = 45 * 1000;
  var sleepyTimer = null;

  if (duck.complete) ensurePrefetched(DEFAULT_COLOR);
  else duck.addEventListener("load", function () { ensurePrefetched(DEFAULT_COLOR); });

  function goSleepy() {
    if (dragging) return;
    currentPose = "sleepy";
    applyDuckImage();
    setHelpDuckSleepy(true);
  }

  function scheduleSleepy() {
    clearTimeout(sleepyTimer);
    sleepyTimer = setTimeout(goSleepy, SLEEPY_TIMEOUT);
  }

  function markActivity() {
    if (currentPose === "sleepy" && !dragging) {
      currentPose = "idle";
      applyDuckImage();
    }
    setHelpDuckSleepy(false);
    scheduleSleepy();
  }

  ["pointerdown", "pointermove", "keydown", "wheel"].forEach(function (type) {
    window.addEventListener(type, markActivity, { passive: true });
  });
  scheduleSleepy(); // the clock starts from page load, with zero activity yet

  // Alpha hit-testing: the <img> element's box is a big square, but the
  // duck drawn inside it is an irregular shape with real transparency
  // around it — without this, hovering (or grabbing) the empty corners of
  // that square would act like hovering/grabbing the duck herself. A
  // hidden canvas holds the same art at its natural resolution purely so
  // its pixels can be read back with getImageData.
  var hitCanvas = document.createElement("canvas");
  var hitCtx = hitCanvas.getContext("2d", { willReadFrequently: true });
  var hitReady = false;
  var hitReadyPose = null; // which pose hitCanvas currently holds

  // duck.src changes on every color swap too, not just a pose change, but
  // different colors of the same pose share an identical silhouette — so
  // this only actually redraws when the pose itself changed.
  function prepareHitCanvas() {
    if (hitReady && hitReadyPose === currentPose) return;
    hitCanvas.width = duck.naturalWidth;
    hitCanvas.height = duck.naturalHeight;
    hitCtx.drawImage(duck, 0, 0);
    hitReady = true;
    hitReadyPose = currentPose;
  }
  if (duck.complete) prepareHitCanvas();
  else duck.addEventListener("load", prepareHitCanvas);

  function alphaAt(clientX, clientY) {
    if (!hitReady) return 0; // fail closed — no false grabs before it's ready
    var rect = duck.getBoundingClientRect();
    var nx = (clientX - rect.left) / rect.width;
    var ny = (clientY - rect.top) / rect.height;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return 0;
    var px = Math.min(hitCanvas.width - 1, Math.floor(nx * hitCanvas.width));
    var py = Math.min(hitCanvas.height - 1, Math.floor(ny * hitCanvas.height));
    return hitCtx.getImageData(px, py, 1, 1).data[3];
  }
  var ALPHA_THRESHOLD = 40;

  function place(clientX, clientY) {
    var w = duck.offsetWidth, h = duck.offsetHeight;
    var x = clamp(clientX - offsetX, MIN_VISIBLE - w, window.innerWidth - MIN_VISIBLE);
    var y = clamp(clientY - offsetY, MIN_VISIBLE - h, window.innerHeight - MIN_VISIBLE);
    duck.style.left = x + "px";
    duck.style.top = y + "px";
  }

  duck.addEventListener("pointerdown", function (e) {
    if (alphaAt(e.clientX, e.clientY) <= ALPHA_THRESHOLD) return; // clicked a transparent corner

    var rect = duck.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    dragging = true;
    currentPose = "angry"; // she does not appreciate being picked up
    applyDuckImage();
    duck.classList.add("hovering");
    duck.style.cursor = "grabbing";
    duck.setPointerCapture(e.pointerId);
  });

  // Listened on window, not duck, so this keeps running even over a
  // transparent pixel where duck's own pointer-events is currently "none"
  // (see below) — a listener on duck itself would stop receiving events
  // there at all, since duck wouldn't be a valid hit target in that spot.
  window.addEventListener("pointermove", function (e) {
    if (dragging) {
      place(e.clientX, e.clientY);
      markSolved(); // any real movement while held counts, even a little
      return;
    }
    var onDuck = alphaAt(e.clientX, e.clientY) > ALPHA_THRESHOLD;
    duck.classList.toggle("hovering", onDuck);
    duck.style.cursor = onDuck ? "grab" : "default";
    // duck's <img> box is a big square, well beyond her actual silhouette
    // (see the alpha hit-testing comment above) — without this, that whole
    // square swallows hover/clicks even over its transparent regions,
    // including wherever it happens to overlap .reveal's download button,
    // making the button's hover state unreliable any time duck's *box*
    // (not just her visible art) sits near it. Shrinking her real
    // interactive area to just her opaque pixels lets a transparent-region
    // hover/click pass straight through to whatever's actually underneath.
    duck.style.pointerEvents = onDuck ? "auto" : "none";
  });

  function stop() {
    dragging = false;
    currentPose = "idle"; // back to her usual self once let go
    applyDuckImage();
    scheduleSleepy(); // letting go counts as activity too, even with no pointermove in between
  }
  duck.addEventListener("pointerup", stop);
  duck.addEventListener("pointercancel", stop);

  // This link points straight at the DMG asset (not the GitHub releases
  // page), so clicking it triggers a real file download rather than a page
  // navigation — the browser never leaves this page, so the quack always
  // gets to play out in full.
  var downloadLink = document.getElementById("download-link");
  downloadLink.addEventListener("click", function () {
    try {
      new Audio("assets/quack.mp3").play().catch(function () {});
    } catch (e) {}
  });

  // Hovering a letter of "dockling!" turns her that color — whatever pose
  // she's actually in (idle, angry mid-drag, or asleep) stays exactly as
  // it was, only the color changes. Reverts to stickyColor (not always
  // yellow — see its declaration) once the mouse leaves the letter.
  // Clicking a letter locks that color in as the new stickyColor, so it
  // stays even after the mouse moves away, until another letter is
  // clicked. Mouse-only on purpose (mouseenter/leave/click, not pointer
  // events) — touch has no real hover, so there's nothing meaningful to
  // wire up there.
  // Shared by mouseenter and click below: switches her to `color` and
  // makes sure angry+sleepy for it are on their way in. Idle is covered by
  // applyDuckImage() alone, but without also prefetching here, dragging her
  // (or just leaving her be for 60s) right after selecting a new color
  // meant a real, visible delay the first time that pose was actually
  // needed, waiting on a fetch that only just started.
  function selectColor(color) {
    currentColor = color;
    applyDuckImage();
    applyHelpDuckColor(color);
    ensurePrefetched(color);
  }

  document.querySelectorAll("#title span").forEach(function (letter) {
    var color = letter.getAttribute("data-color");
    letter.addEventListener("mouseenter", function () {
      selectColor(color);
    });
    letter.addEventListener("mouseleave", function () {
      currentColor = stickyColor;
      applyDuckImage();
      applyHelpDuckColor(stickyColor);
    });
    letter.addEventListener("click", function () {
      stickyColor = color;
      // Also selects here, not just from mouseenter above: if the cursor is
      // already resting on a letter when the page loads (or the user
      // returns via back-navigation without moving the mouse first), click
      // can fire with no preceding mouseenter at all.
      selectColor(color);
    });
  });

  // The corner "help" duck: thinking pose + "Need help?" at rest, crossfades
  // to the eureka pose + a hint on hover (image crossfade is plain CSS —
  // see its own comment — only the bubble *text* needs JS, since swapping
  // text content isn't something CSS alone can do cleanly). Once the big
  // duck's actually been dragged (any real movement, not just a click —
  // wired into the drag handler above via markSolved()), she "gets it" for
  // the rest of the visit: thumbs-up pose + "Genius!" at rest, permanently.
  var helpDuck = document.getElementById("helpDuck");
  var helpBubble = document.getElementById("helpBubble");
  var HELP_POSES = ["thinking", "eureka", "thumbsup", "sleepy"];
  var helpPoseImgs = {};
  HELP_POSES.forEach(function (pose) {
    helpPoseImgs[pose] = helpDuck.querySelector(".help-duck-" + pose);
  });

  // Keeps all four layered pose images (see the CSS crossfade above) in
  // whatever color the big duck's currently showing — called from every
  // place currentColor changes, same as the big duck's own applyDuckImage().
  // Rewriting all four .src attributes rather than swapping one active
  // layer's source is what lets the existing opacity crossfade keep working
  // completely unchanged: each layer just always holds the *right* color's
  // art for its own pose, whichever one happens to be visible right now.
  function applyHelpDuckColor(color) {
    HELP_POSES.forEach(function (pose) {
      helpPoseImgs[pose].src = "assets/help-" + color + "-" + pose + ".png";
    });
  }
  applyHelpDuckColor(currentColor);

  var HELP_TEXT = "Need help?";
  var HOVER_HINT_TEXT = "I think the duck is hiding something";
  var SOLVED_TEXT = "Genius!";
  var SLEEPY_TEXT = "Zzz…";
  var solved = false;
  var helpSleepy = false;

  // Sleepy outranks solved at rest — same "most recent state wins" idea as
  // the big duck's own idle→sleepy takeover — but hovering (below) outranks
  // both, same as it always did.
  function restBubbleText() {
    if (helpSleepy) return SLEEPY_TEXT;
    return solved ? SOLVED_TEXT : HELP_TEXT;
  }

  function showRestBubble() {
    helpBubble.textContent = restBubbleText();
  }
  showRestBubble();

  // Single source of truth for "is she currently being hovered/focused,"
  // driving both the image (via the .hovering class the CSS crossfade
  // keys off of) and the bubble text together, always in lockstep.
  // Previously the image used CSS :hover/:focus directly while the text
  // was set independently by mouseenter/mouseleave — a real bug, not
  // hypothetical: clicking her focuses the element (so :focus keeps the
  // eureka image showing), then moving the mouse away fires mouseleave
  // (reverting the *text* to "Need help?") without ever blurring — the
  // two fell out of sync, eureka duck with a "Need help?" bubble. Routing
  // everything through this one function is what makes "mouse moved away"
  // always win for both, regardless of any lingering click-focus.
  var isHovering = false;
  function setHovering(hovering) {
    isHovering = hovering;
    helpDuck.classList.toggle("hovering", hovering);
    helpBubble.textContent = hovering ? HOVER_HINT_TEXT : restBubbleText();
  }

  // Toggles the .sleepy class the CSS crossfade (above) keys off of, and
  // refreshes the bubble text to match — called from goSleepy()/
  // markActivity() on the big duck's own shared idle timer, not a second
  // timer of her own. Skipped while genuinely hovering/focused, same as
  // markSolved() below, so the hint stays showing until that ends on its
  // own rather than getting interrupted mid-hover.
  function setHelpDuckSleepy(isSleepy) {
    if (helpSleepy === isSleepy) return;
    helpSleepy = isSleepy;
    helpDuck.classList.toggle("sleepy", isSleepy);
    if (!isHovering) showRestBubble();
  }

  helpDuck.addEventListener("mouseenter", function () { setHovering(true); });
  helpDuck.addEventListener("mouseleave", function () { setHovering(false); });
  helpDuck.addEventListener("focus", function () { setHovering(true); });
  helpDuck.addEventListener("blur", function () { setHovering(false); });

  function markSolved() {
    if (solved) return; // one-way — once she's proud of you, she stays proud
    solved = true;
    helpDuck.classList.add("solved");
    helpDuck.setAttribute("aria-label", SOLVED_TEXT);
    if (!isHovering) showRestBubble();
  }
})();
</script>
</body>
</html>
