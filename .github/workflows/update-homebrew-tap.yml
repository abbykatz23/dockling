name: Update Homebrew tap

# Runs whenever tools/notarize_release.sh's release is published (via
# `gh release create` or the web UI) — updates the cask in
# github.com/abbykatz23/homebrew-dockling to point at the new DMG, with no
# manual step on top of cutting the release itself. GitHub already computes
# a sha256 digest for every uploaded release asset, so this never needs to
# download the DMG itself to get one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (defaults to the latest release — for manually re-running this without cutting a new release)"
        required: false
        default: ""

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Look up the release's DMG digest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          fi
          VERSION="${TAG#v}"
          # `// empty` turns a missing/still-null digest into no output at
          # all, so the emptiness check below actually catches it — plain
          # `.digest` would otherwise print the literal string "null" (jq's
          # rendering of JSON null), which isn't empty and isn't prefixed
          # with "sha256:", so it would sail through as SHA256="null" and
          # get committed straight into the cask.
          DIGEST=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name == "Dockling.dmg") | .digest // empty')
          SHA256="${DIGEST#sha256:}"
          if [ -z "$SHA256" ]; then
            echo "error: no sha256 digest found for Dockling.dmg on release $TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: abbykatz23/homebrew-dockling
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the cask
        run: |
          cat > tap/Casks/dockling.rb <<EOF
          cask "dockling" do
            version "${{ steps.release.outputs.version }}"
            sha256 "${{ steps.release.outputs.sha256 }}"

            url "https://github.com/abbykatz23/dockling/releases/download/v#{version}/Dockling.dmg"
            name "Dockling"
            desc "Live animated duck in your Dock for each Claude Code session"
            homepage "https://github.com/abbykatz23/dockling"

            app "Dockling.app"

            zap trash: [
              "~/.dockling",
            ]
          end
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name "dockling-release-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Cask already up to date — nothing to commit."
            exit 0
          fi
          git add Casks/dockling.rb
          git commit -m "dockling ${{ steps.release.outputs.version }}"
          git push
